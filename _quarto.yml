project:
  type: website
  output-dir: docs

website:
  description: "PhD researcher exploring AI's impact on human cognition and behavior"
  page-navigation: true
  title: "Ho Chin Wei"          
  favicon: "assets/favicon.webp"
  site-url: "https://hochinwei.com"

  page-footer:
    left: "&copy; 2025 Ho Chin Wei"
    right: "Built with [Quarto](https://quarto.org/)"

  navbar:
    pinned: true
    right:
      - text: "About"
        href: about.qmd
      - text: "Blog"
        href: blog/index.qmd
      - text: "Projects"
        href: projects/index.qmd
      - text: "CV"
        href: CV.qmd
      - text: "Contact"
        href: contact.qmd

format:
  html:
    theme:
      - default          
      - styles.scss
    toc: false
    smooth-scroll: true
    link-external-newwindow: true
    highlight-style: arrow
    icon: fontawesome
    include-after-body:
      - text: |
          <script src="/assets/site.js"></script>

extensions:
  - quarto-ext/fontawesome
